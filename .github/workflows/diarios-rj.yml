name: Diários oficiais municipais RJ (raspadores Querido Diário)
# Lê os diários direto dos sites das prefeituras com os raspadores abertos do Querido Diário (MIT),
# sem usar a API deles. Resultado: relatório (artefato) + no banco, como INDÍCIO: menções a empresas da base e
# CNPJs citados perto de termo ambiental (possíveis clientes novos). PDF escaneado é lido por OCR.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para trás (rodada normal)'
        default: '7'
      so:
        description: 'Só estes robôs (expressão regular, ex.: rj_marica_v3|rj_aperibe). Vazio = todos'
        default: ''
      meses:
        description: 'Histórico: quantos blocos de 30 dias para trás (ex.: 12 = 1 ano). Vazio = rodada normal'
        default: ''
  schedule:
    - cron: '0 11 * * 1-5'  # 1ª rotina do dia útil: 08:00 (Brasília). sempre olha 5 dias para trás
permissions:
  contents: read
jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      blocos: ${{ steps.p.outputs.blocos }}
    steps:
      - id: p
        env:
          DIAS: ${{ github.event.inputs.dias || '5' }}
          MESES: ${{ github.event.inputs.meses || '' }}
        run: |
          # rodada normal: 1 bloco (hoje - DIAS até hoje). Histórico: blocos de 30 dias, do mais novo ao mais antigo
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os
          hoje = dt.date.today(); m = os.environ['MESES'].strip()
          if m:
              b = [{'ini': str(hoje - dt.timedelta(days=30 * (i + 1) - 1)), 'fim': str(hoje - dt.timedelta(days=30 * i))} for i in range(int(m))]
          else:
              b = [{'ini': str(hoje - dt.timedelta(days=int(os.environ['DIAS']))), 'fim': str(hoje)}]
          print('blocos=' + json.dumps(b))
          PY
  diarios:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1   # um bloco por vez: não sobrecarrega os sites das prefeituras
      matrix:
        bloco: ${{ fromJSON(needs.plano.outputs.blocos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preparar raspadores e leitor de PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por >/dev/null   # OCR para diário escaneado
          git clone -q --depth 1 https://github.com/okfn-brasil/querido-diario qd
          # robôs próprios (reservas) entram junto com os do Querido Diário
          cp coletor/raspadores/*.py qd/querido_diario_raspadores/gazette/spiders/rj/
          # 6 robôs vêm configurados para passar pelo proxy pago do Querido Diário (Zyte), que não temos.
          # Aqui eles acessam o site direto; se o site recusar, a falha fica registrada (sem contornar).
          sed -i 's/zyte_smartproxy_enabled = True/zyte_smartproxy_enabled = False/' qd/querido_diario_raspadores/gazette/spiders/rj/*.py
          cd qd/querido_diario_raspadores && uv sync -q
      - name: Listas que só abrem com navegador (Betha, Tanguá)
        env:
          INICIO: ${{ matrix.bloco.ini }}
          FIM: ${{ matrix.bloco.fim }}
          SO: ${{ github.event.inputs.so || '' }}
        run: |
          # Só a página pública, como visitante; se falhar, o robô registra que a lista não existe.
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 || echo "navegador não instalou"
          # Betha (Rio das Flores) desligado em 10/11: o portal responde 403 ao navegador do GitHub. Religar do Dell.
          if false; then timeout 900 node coletor/navegador/betha.js || echo "Betha: falhou (registrado, sem contornar)"; fi
          # Tanguá (Supernova/JSF): o PDF sai por formulário; o navegador baixa e grava out/rj_tangua.jsonl direto
          if echo rj_tangua | grep -qE "${SO:-.}"; then timeout 1500 node coletor/navegador/tangua.js || echo "Tanguá: falhou (registrado, sem contornar)"; fi
          # SJB, São José de Ubá, Italva, Cardoso Moreira: a lista vem por POST que só responde à própria página (11/11/2026)
          if printf 'rj_sao_joao_da_barra\nrj_sao_jose_de_uba\nrj_italva\nrj_cardoso_moreira\n' | grep -qE "${SO:-.}"; then timeout 1500 node coletor/navegador/portalgov.js || echo "SJB/Ubá: falhou (registrado, sem contornar)"; fi
      - name: Baixar diários (32 municípios do RJ + AEMERJ; Rio fica com o notebook)
        working-directory: qd/querido_diario_raspadores
        env:
          INICIO: ${{ matrix.bloco.ini }}   # rotina: 5 dias para trás (cobre fim de semana, feriado e ponto facultativo, inclusive carnaval); repetição não duplica
          FIM: ${{ matrix.bloco.fim }}
          SO: ${{ github.event.inputs.so || '' }}
          LIMITE: ${{ github.event.inputs.meses && '2400' || '1200' }}   # segundos por raspador: 20 min na rotina, 40 min num bloco de 30 dias
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/db"
          # Rio (DOWeb) sai daqui: o notebook baixa o DO Rio de IP do Brasil (plano único 09/11); o GitHub é recusado
          uv run scrapy list | grep '^rj_' | grep -v '^rj_rio_de_janeiro$' | grep -E "${SO:-.}" > rj.txt || true   # SO pode não casar com nenhum robô Scrapy (ex.: só Tanguá, que vem pelo navegador)
          echo "$(wc -l < rj.txt) raspadores do RJ, de $INICIO a $FIM"
          # 6 por vez; cada um tem até $LIMITE s. Bloqueio/captcha = falha registrada, nunca contornada.
          cat rj.txt | xargs -P 6 -I{} sh -c 'QUERIDODIARIO_DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/db/{}.db timeout $LIMITE uv run scrapy crawl {} -a start='"$INICIO"' -a end='"$FIM"' -s SPIDERMON_ENABLED=False -s LOG_LEVEL=INFO -s LOG_FILE=$GITHUB_WORKSPACE/logs/{}.log -s FILES_STORE=$GITHUB_WORKSPACE/pdf -O $GITHUB_WORKSPACE/out/{}.jsonl; echo "{}: fim (código $?)"' || true
          true
      - name: Ler os PDFs e procurar empresas e termos ambientais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILES_STORE: ${{ github.workspace }}/pdf
          DIAS: ${{ matrix.bloco.ini }} a ${{ matrix.bloco.fim }}
        run: |
          python3 -I coletor/diarios_rj.py out relatorio
          for f in logs/*.log; do n=$(basename $f .log); e=$(grep -c ' ERROR: ' $f || true); echo "$n;$e erros" ; done > relatorio/erros_por_raspador.txt
          cat relatorio/resumo.md >> "$GITHUB_STEP_SUMMARY"
          echo "===== RESUMO ====="; cat relatorio/resumo.md
          echo "===== EDIÇÕES POR RASPADOR ====="; for f in out/*.jsonl; do echo "$(basename $f .jsonl);$(wc -l < $f) edições"; done
          echo "===== ERROS ====="; cat relatorio/erros_por_raspador.txt
          echo "===== DIAGNÓSTICO POR RASPADOR (respostas HTTP, itens, motivo do fim) ====="
          for f in logs/*.log; do echo "--- $(basename $f .log)"; grep -oE "'(downloader/response_status_count/[0-9]+|item_scraped_count|finish_reason|downloader/request_count)': [^,}]+" $f | tr '\n' ' '; echo; done
          echo "===== PRIMEIROS ERROS ====="; grep -h -m2 ' ERROR: ' logs/*.log | cut -c1-300 | head -40 || true
          echo "===== ROBÔS QUE CAÍRAM (últimas linhas do log) ====="; for f in logs/*.log; do grep -q finish_reason $f || { echo "--- $(basename $f .log)"; grep -v DEBUG $f | tail -12 | cut -c1-300; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diarios-rj-relatorio-${{ matrix.bloco.ini }}
          path: |
            relatorio/
            logs/
          retention-days: 30
