name: Diários oficiais municipais RJ (raspadores Querido Diário)
# Lê os diários direto dos sites das prefeituras com os raspadores abertos do Querido Diário (MIT),
# sem usar a API deles. Resultado: relatório (artefato) + menções a empresas da base gravadas como INDÍCIO.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para trás'
        default: '7'
  schedule:
    - cron: '0 11 * * *'    # 1ª rotina do dia: 08:00 (Brasília), quando os diários do dia já saíram
permissions:
  contents: read
jobs:
  diarios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preparar raspadores e leitor de PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          git clone -q --depth 1 https://github.com/okfn-brasil/querido-diario qd
          cd qd/querido_diario_raspadores && uv sync -q
      - name: Baixar diários (33 municípios do RJ)
        working-directory: qd/querido_diario_raspadores
        env:
          DIAS: ${{ github.event.inputs.dias || '3' }}   # rotina diária: 3 dias (cobre fim de semana e edição extra)
        run: |
          INICIO=$(date -d "-${DIAS} days" +%F)
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/db"
          uv run scrapy list | grep '^rj_' > rj.txt
          echo "$(wc -l < rj.txt) raspadores do RJ, desde $INICIO"
          # 6 por vez; cada um tem até 20 min. Bloqueio/captcha = falha registrada, nunca contornada.
          cat rj.txt | xargs -P 6 -I{} sh -c 'QUERIDODIARIO_DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/db/{}.db timeout 1200 uv run scrapy crawl {} -a start='"$INICIO"' -s SPIDERMON_ENABLED=False -s LOG_LEVEL=INFO -s LOG_FILE=$GITHUB_WORKSPACE/logs/{}.log -s FILES_STORE=$GITHUB_WORKSPACE/pdf -O $GITHUB_WORKSPACE/out/{}.jsonl; echo "{}: fim (código $?)"' || true
          true
      - name: Ler os PDFs e procurar empresas e termos ambientais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILES_STORE: ${{ github.workspace }}/pdf
        run: |
          python3 -I coletor/diarios_rj.py out relatorio
          for f in logs/*.log; do n=$(basename $f .log); e=$(grep -c ' ERROR: ' $f || true); echo "$n;$e erros" ; done > relatorio/erros_por_raspador.txt
          cat relatorio/resumo.md >> "$GITHUB_STEP_SUMMARY"
          echo "===== RESUMO ====="; cat relatorio/resumo.md
          echo "===== EDIÇÕES POR RASPADOR ====="; for f in out/*.jsonl; do echo "$(basename $f .jsonl);$(wc -l < $f) edições"; done
          echo "===== ERROS ====="; cat relatorio/erros_por_raspador.txt
          echo "===== PRIMEIROS ERROS ====="; grep -h -m2 ' ERROR: ' logs/*.log | cut -c1-300 | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diarios-rj-relatorio
          path: |
            relatorio/
            logs/
          retention-days: 30
