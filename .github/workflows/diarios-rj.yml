name: Diários oficiais municipais RJ (raspadores Querido Diário)
# Lê os diários direto dos sites das prefeituras com os raspadores abertos do Querido Diário (MIT),
# sem usar a API deles. Resultado: relatório (artefato) + no banco, como INDÍCIO: menções a empresas da base e
# CNPJs citados perto de termo ambiental (possíveis clientes novos). PDF escaneado é lido por OCR.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: 'Quantos dias para trás'
        default: '7'
  schedule:
    - cron: '0 11 * * 1-5'  # 1ª rotina do dia útil: 08:00 (Brasília). sempre olha 5 dias para trás
permissions:
  contents: read
jobs:
  diarios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Preparar raspadores e leitor de PDF
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-por >/dev/null   # OCR para diário escaneado
          git clone -q --depth 1 https://github.com/okfn-brasil/querido-diario qd
          # robôs próprios (reservas) entram junto com os do Querido Diário
          cp coletor/raspadores/*.py qd/querido_diario_raspadores/gazette/spiders/rj/
          # 6 robôs vêm configurados para passar pelo proxy pago do Querido Diário (Zyte), que não temos.
          # Aqui eles acessam o site direto; se o site recusar, a falha fica registrada (sem contornar).
          sed -i 's/zyte_smartproxy_enabled = True/zyte_smartproxy_enabled = False/' qd/querido_diario_raspadores/gazette/spiders/rj/*.py
          cd qd/querido_diario_raspadores && uv sync -q
      - name: Baixar diários (32 municípios do RJ + AEMERJ; Rio fica com o notebook)
        working-directory: qd/querido_diario_raspadores
        env:
          DIAS: ${{ github.event.inputs.dias || '5' }}   # rotina: 5 dias para trás (cobre fim de semana, feriado e ponto facultativo, inclusive carnaval); repetição não duplica
        run: |
          INICIO=$(date -d "-${DIAS} days" +%F)
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/logs" "$GITHUB_WORKSPACE/db"
          # Rio (DOWeb) sai daqui: o notebook baixa o DO Rio de IP do Brasil (plano único 09/11); o GitHub é recusado
          uv run scrapy list | grep '^rj_' | grep -v '^rj_rio_de_janeiro$' > rj.txt
          echo "$(wc -l < rj.txt) raspadores do RJ, desde $INICIO"
          # 6 por vez; cada um tem até 20 min. Bloqueio/captcha = falha registrada, nunca contornada.
          cat rj.txt | xargs -P 6 -I{} sh -c 'QUERIDODIARIO_DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/db/{}.db timeout 1200 uv run scrapy crawl {} -a start='"$INICIO"' -s SPIDERMON_ENABLED=False -s LOG_LEVEL=INFO -s LOG_FILE=$GITHUB_WORKSPACE/logs/{}.log -s FILES_STORE=$GITHUB_WORKSPACE/pdf -O $GITHUB_WORKSPACE/out/{}.jsonl; echo "{}: fim (código $?)"' || true
          true
      - name: Ler os PDFs e procurar empresas e termos ambientais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILES_STORE: ${{ github.workspace }}/pdf
          DIAS: ${{ github.event.inputs.dias || '5' }}
        run: |
          python3 -I coletor/diarios_rj.py out relatorio
          for f in logs/*.log; do n=$(basename $f .log); e=$(grep -c ' ERROR: ' $f || true); echo "$n;$e erros" ; done > relatorio/erros_por_raspador.txt
          cat relatorio/resumo.md >> "$GITHUB_STEP_SUMMARY"
          echo "===== RESUMO ====="; cat relatorio/resumo.md
          echo "===== EDIÇÕES POR RASPADOR ====="; for f in out/*.jsonl; do echo "$(basename $f .jsonl);$(wc -l < $f) edições"; done
          echo "===== ERROS ====="; cat relatorio/erros_por_raspador.txt
          echo "===== DIAGNÓSTICO POR RASPADOR (respostas HTTP, itens, motivo do fim) ====="
          for f in logs/*.log; do echo "--- $(basename $f .log)"; grep -oE "'(downloader/response_status_count/[0-9]+|item_scraped_count|finish_reason|downloader/request_count)': [^,}]+" $f | tr '\n' ' '; echo; done
          echo "===== PRIMEIROS ERROS ====="; grep -h -m2 ' ERROR: ' logs/*.log | cut -c1-300 | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diarios-rj-relatorio
          path: |
            relatorio/
            logs/
          retention-days: 30
