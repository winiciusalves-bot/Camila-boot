name: Coleta diária IBAMA -> Supabase
on:
  workflow_run:              # roda logo depois dos diários municipais (que são a 1ª coisa do dia, às 08:00)
    workflows: ['Diários oficiais municipais RJ (raspadores Querido Diário)']
    types: [completed]
  schedule:
    - cron: '0 14 * * *'    # reserva às 11:00 (Brasília), caso os diários não tenham rodado
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora
permissions:
  contents: read
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -I coletor/coletar.py
