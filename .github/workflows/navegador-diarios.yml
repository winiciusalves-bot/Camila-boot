name: Sondar diários com navegador (só olha, não contorna bloqueio)
on:
  workflow_dispatch:
    inputs:
      qual:
        description: 'sondar | fontes | links | achar'
        default: 'links'
permissions:
  contents: read
jobs:
  sondar:
    if: inputs.qual == 'sondar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node coletor/navegador/sondar.js | tee sondagem.jsonl
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat sondagem.jsonl >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
  fontes:
    if: inputs.qual == 'fontes'
    # PNCP + site da prefeitura + plataformas comuns, para os 92 municípios do RJ
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -I coletor/sondar_fornecedores.py relatorio
          python3 -I coletor/sondar_fontes.py relatorio
          cat relatorio/fontes_municipios.md >> "$GITHUB_STEP_SUMMARY"
          echo "===== CSV ====="; cat relatorio/fontes_municipios.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontes-municipios
          path: relatorio/
  links:
    # sites onde o robô de lista de PDF não achou edição: HTML cru x página montada, links e chamadas de dados
    if: inputs.qual == 'links'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          true
          echo "===== XHR ====="; node coletor/navegador/clique.js
  achar:
    # municípios sem coleta: acha o diário a partir da página inicial da prefeitura
    if: inputs.qual == 'achar'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node coletor/navegador/achar.js | tee achar.jsonl
